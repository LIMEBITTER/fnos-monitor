name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查与构建
        run: pnpm build

      - name: 脱敏规则自测
        run: node scripts/test-public-view.mjs

      - name: 邮件客户端自测（假 SMTP）
        run: node scripts/test-mailer.mjs

      - name: 冒烟测试（API / SSE / 静态页）
        run: node scripts/smoke.mjs
